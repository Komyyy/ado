name = "ado"
version = "0.2.0"
keywords = ["math"]
defaultTargets = ["Ado"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
doc.verso = true

[[require]]
name = "verso"
scope = "leanprover"
rev = "main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "Ado"

[[lean_lib]]
name = "AdoPage"

[[lean_exe]]
name = "ado-pages"
root = "AdoPageMain"
