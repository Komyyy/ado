name = "ado"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Ado"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "Ado"
